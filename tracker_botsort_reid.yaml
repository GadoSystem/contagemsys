# Modo mais robusto contra troca de ID. Custa mais FPS que ByteTrack.
# Use se os animais se sobrepuserem muito ou se ainda houver ID switch excessivo.
tracker_type: botsort
track_high_thresh: 0.30
track_low_thresh: 0.10
new_track_thresh: 0.40
track_buffer: 60
match_thresh: 0.85
fuse_score: true
gmc_method: none
proximity_thresh: 0.50
appearance_thresh: 0.85
with_reid: true
model: auto
