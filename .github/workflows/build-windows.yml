name: Build ContagemSys.exe (Windows)

# Rode em Actions > "Build ContagemSys.exe (Windows)" > Run workflow, ou crie
# uma tag v*. O instalador fica em "Artifacts" na pagina da execucao.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-desktop.txt

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-desktop.txt

      - name: Testes
        run: python -m unittest discover -s tests

      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean packaging/ContagemSys.spec

      - name: Instalador (Inno Setup)
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          iscc packaging/instalador.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ContagemSys-Setup
          path: dist/ContagemSys-Setup.exe
          retention-days: 14
